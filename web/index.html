<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Balcão Ágil - Sistema ERP para Depósitos e Lojas de Materiais de Construção">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Balcão Ágil">

  <!-- Ícone da Aba do Navegador (Favicon Oficial Balcão Ágil) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231E40AF'/><path d='M16 18h6l4.2 18.4a3 3 0 0 0 2.9 2.3h18.2a3 3 0 0 0 2.9-2.2l3.4-12.5H23.5' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/><circle cx='29' cy='48' r='3.5' fill='white'/><circle cx='44' cy='48' r='3.5' fill='white'/></svg>">

  <title>Balcão Ágil</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Evita tela branca sem feedback enquanto os scripts baixam no celular */
    body {
      margin: 0;
      background-color: #0F172A;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px auto;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.5px;">Balcão Ágil</div>
    <div style="font-size: 12px; color: #94A3B8; margin-top: 4px;">Carregando sistema...</div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function () {
      var loadingIndicator = document.getElementById('loading');
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: async function (engineInitializer) {
          var appRunner = await engineInitializer.initializeEngine();
          if (loadingIndicator) {
            loadingIndicator.remove();
          }
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
